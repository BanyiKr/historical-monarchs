l_braz_por:

 hm_british_windsor_name_change: "Renomear a Casa Real"
 hm_british_windsor_name_change_desc: "A Casa de Saxe-Coburgo e Gotha é uma casa nobre alemã de grande história e prestígio. No entanto, o atual clima geopolítico gerou um forte sentimento antialemão, tanto no país quanto internacionalmente. Diante disso, e da crescente impopularidade das monarquias em toda a Europa, seria prudente abandonar todos os títulos e nomes de casas alemães detidos pela Coroa Alemã e optar por nomes anglicizados, passando a denominar a Casa Real de “Casa de Windsor”."
 hm_british_windsor_name_change_tt.1: "Qualquer [concept_major_power] ou superior na [GetGeographicRegion('geographic_region_europe').GetName] com [Concept('concept_primary_cultures','$concept_primary_culture$')] do $north_german$:\n$EFFECT_LIST_BULLET$Está em guerra com o país [ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$A Infâmia é maior ou igual a $infamy_notorious$\n$EFFECT_LIST_BULLET$O valor das relações com o país [ROOT.GetCountry.GetNameNoFlag] é menor que $relations_neutral$"
 hm_british_windsor_name_change_tt.2: "Todos os $concept_characters$ da dinastia governante mudam seu sobrenome para “$Windsor$”"

 hm_house_of_belgium_name_change: "Renomear a Casa Real"
 hm_house_of_belgium_name_change_desc: "A Casa de Saxe-Coburgo e Gotha é uma casa nobre alemã de grande história e prestígio. No entanto, o atual clima geopolítico gerou um forte sentimento antialemão, tanto no país quanto internacionalmente. Diante disso, e da crescente impopularidade das monarquias em toda a Europa, seria prudente abandonar todos os títulos e nomes de casas alemães detidos pela Coroa Alemã e optar por nomes galicizados, passando a denominar a Casa Real de “Casa da Bélgica”."
