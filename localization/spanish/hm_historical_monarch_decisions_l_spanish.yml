l_spanish:

 hm_british_windsor_name_change: "Cambiar el nombre de la Casa Real"
 hm_british_windsor_name_change_desc: "La Casa de Sajonia-Coburgo y Gotha es una casa noble alemana de gran historia y prestigio. Sin embargo, el actual clima geopolítico ha dado lugar a un fuerte sentimiento antialemán tanto a nivel nacional como internacional. A la luz de esto, y dada la creciente impopularidad de las monarquías en toda Europa, sería prudente renunciar a todos los títulos y nombres de la casa que se ostentan bajo la Corona alemana y optar por nombres anglicizados, denominando así a la Casa Real «Casa de Windsor»."
 hm_british_windsor_name_change_tt.1: "Cualquier [concept_country|l] que sea una [concept_major_power] o de rango superior en [GetGeographicRegion('geographic_region_europe').GetName] y tenga $north_german$ como [Concept('concept_primary_cultures','$concept_primary_culture$')]:\n$EFFECT_LIST_BULLET$Está en guerra con [ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$La infamia es superior o igual a $infamy_notorious$\n$EFFECT_LIST_BULLET$Las relaciones con [ROOT.GetCountry.GetNameNoFlag] son inferiores a $relations_neutral$"
 hm_british_windsor_name_change_tt.2: "Todos los $concept_characters$ de la dinastía gobernante cambian su apellido por «$Windsor$»"

 hm_house_of_belgium_name_change: "Cambiar el nombre de la Casa Real"
 hm_house_of_belgium_name_change_desc: "La Casa de Sajonia-Coburgo y Gotha es una casa noble alemana de gran historia y prestigio. Sin embargo, el actual clima geopolítico ha dado lugar a un fuerte sentimiento antialemán tanto a nivel nacional como internacional. A la luz de esto, y dada la creciente impopularidad de las monarquías en toda Europa, sería prudente renunciar a todos los títulos alemanes y nombres de la casa que se ostentan bajo la Corona alemana, y optar por nombres galicizados, denominando así a la Casa Real la «Casa de Bélgica»."
 hm_house_of_belgium_name_change_tt.1: "Cualquier [concept_country|l] que sea una [concept_major_power] o de rango superior en [GetGeographicRegion('geographic_region_europe').GetName] y tenga $north_german$ como [Concept('concept_primary_cultures','$concept_primary_culture$')]:\n$EFFECT_LIST_BULLET$Está en guerra con [ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$La infamia es superior o igual a $infamy_notorious$\n$EFFECT_LIST_BULLET$Las relaciones con [ROOT.GetCountry.GetNameNoFlag] son inferiores a $relations_neutral$"
 hm_house_of_belgium_name_change_tt.2: "Todos los $concept_characters$ de la dinastía gobernante cambian su apellido por «$de_Belgique$»"