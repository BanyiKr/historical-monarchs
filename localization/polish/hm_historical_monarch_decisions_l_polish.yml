l_polish:

 hm_british_windsor_name_change: "Zmień nazwę rodu królewskiego"
 hm_british_windsor_name_change_desc: "Ród Saksonii-Coburga i Gotha to niemiecki ród szlachecki o bogatej historii i wielkim prestiżu. Jednak obecna sytuacja geopolityczna spowodowała silne nastroje antyniemieckie zarówno w kraju, jak i za granicą. W związku z tym, a także biorąc pod uwagę rosnącą niepopularność monarchii w całej Europie, rozsądnym rozwiązaniem byłoby zrezygnowanie ze wszystkich niemieckich tytułów i nazw rodowych przyznanych przez koronę niemiecką oraz wybranie nazw w angielskiej wersji, nazywając w ten sposób ród królewski „rodem Windsorów”."
 hm_british_windsor_name_change_tt.1: "Dowolny kraj, który jest [concept_major_power] lub wyższą kategorią w [GetGeographicRegion('geographic_region_europe').GetName] i którego [Concept('concept_primary_cultures','$concept_primary_culture$')] jest $north_german$:\n$EFFECT_LIST_BULLET$Prowadzi wojnę przeciwko następującemu państwu: [ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$Wartość niesławy tego państwa wynosi co najmniej $infamy_notorious$\n$EFFECT_LIST_BULLET$Wartość stosunków z państwem o nazwie [ROOT.GetCountry.GetNameNoFlag] wynosi mniej niż $relations_neutral$"
 hm_british_windsor_name_change_tt.2: "Wszyscy $concept_characters$ z dynastii panującej zmieniają swoje nazwisko na „$Windsor$”"

 hm_house_of_belgium_name_change: "Zmień nazwę rodu królewskiego"
 hm_house_of_belgium_name_change_desc: "Ród Saksonii-Coburga i Gotha to niemiecki ród szlachecki o bogatej historii i wielkim prestiżu. Jednak obecna sytuacja geopolityczna spowodowała silne nastroje antyniemieckie zarówno w kraju, jak i za granicą. W związku z tym, a także biorąc pod uwagę rosnącą niepopularność monarchii w całej Europie, rozsądnym rozwiązaniem byłoby zrzeczenie się wszystkich niemieckich tytułów i nazw rodowych przyznanych przez koronę niemiecką oraz wybranie nazw o francuskim brzmieniu, nazywając w ten sposób ród królewski „Rodem Belgii”."
 hm_house_of_belgium_name_change_tt.1: "Dowolny kraj, który jest [concept_major_power] lub wyższą kategorią w [GetGeographicRegion('geographic_region_europe').GetName] i którego [Concept('concept_primary_cultures','$concept_primary_culture$')] jest $north_german$:\n$EFFECT_LIST_BULLET$Prowadzi wojnę przeciwko następującemu państwu: [ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$Wartość niesławy tego państwa wynosi co najmniej $infamy_notorious$\n$EFFECT_LIST_BULLET$Wartość stosunków z państwem o nazwie [ROOT.GetCountry.GetNameNoFlag] wynosi mniej niż $relations_neutral$"
 hm_house_of_belgium_name_change_tt.2: "Wszyscy $concept_characters$ z dynastii panującej zmieniają swoje nazwisko na „$de_Belgique$”"