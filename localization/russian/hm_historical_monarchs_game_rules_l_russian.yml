 rule_hm_heir_generation: "Создание исторического наследника"
 setting_aggressive_heir_generation: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_aggressive_heir_generation_desc Агрессивное#!#!"
 setting_aggressive_heir_generation_desc: "Игра всегда будет пытаться сгенерировать исторического наследника, даже если его возраст будет отрицательным. Это помогает сохранить непрерывность линии преемственности"
 setting_historical_heir_generation: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_historical_heir_generation_desc Исторические#!#!"
 setting_historical_heir_generation_desc: "Игра будет генерировать исторических наследников только после того, как они появятся на свет в реальности. Это позволяет избежать появления наследников с отрицательным возрастом, однако цепочка преемственности может быть навсегда прервана, если правитель умрет раньше времени"