l_russian:

 hm_british_windsor_name_change: "Переименовать королевский дом"
 hm_british_windsor_name_change_desc: "Дом Саксен-Кобург-Гота — немецкий дворянский род с богатой историей и высоким престижем. Однако нынешняя геополитическая обстановка привела к усилению антигерманских настроений как внутри страны, так и за рубежом. В свете этого, а также учитывая растущую непопулярность монархий по всей Европе, было бы разумно отказаться от всех немецких титулов и названий рода, присвоенных немецкой короной, и выбрать англицизированные названия, назвав таким образом королевский дом «Домом Виндзоров»."
 hm_british_windsor_name_change_tt.1: "Любая [Concept('concept_country', 'страна')], являющаяся [concept_major_power] или страной более высокого уровня в [GetGeographicRegion('geographic_region_europe').GetName], с $north_german$ в качестве [Concept('concept_primary_cultures','$concept_primary_culture$')]:\n$EFFECT_LIST_BULLET$Находится в состоянии войны с [ROOT.GetCountry.GetAltName('RU_CL_TP')]\n$EFFECT_LIST_BULLET$Ее Уровень дурной славы выше или равна $infamy_notorious$\n$EFFECT_LIST_BULLET$Отношения с [ROOT.GetCountry.GetAltNameNoFlag('RU_CL_TP')] ниже, чем $relations_neutral$"
 hm_british_windsor_name_change_tt.2: "Все $concept_characters$ правящей династии меняют свою фамилию на «$Windsor$»"

 hm_house_of_belgium_name_change: "Переименовать королевский дом"
 hm_house_of_belgium_name_change_desc: "Дом Саксен-Кобург-Гота — немецкий дворянский род с богатой историей и высоким престижем. Однако нынешняя геополитическая обстановка привела к усилению антигерманских настроений как внутри страны, так и за рубежом. В свете этого, а также учитывая растущую непопулярность монархий по всей Европе, было бы разумно отказаться от всех немецких титулов и названий рода, присвоенных немецкой короной, и выбрать галлицизированные названия, назвав таким образом королевский дом «Домом Бельгии»."
 hm_house_of_belgium_name_change_tt.1: "Любая [Concept('concept_country', 'страна')], являющаяся [concept_major_power] или страной более высокого уровня в [GetGeographicRegion('geographic_region_europe').GetName], с $north_german$ в качестве [Concept('concept_primary_cultures','$concept_primary_culture$')]:\n$EFFECT_LIST_BULLET$Находится в состоянии войны с [ROOT.GetCountry.GetAltName('RU_CL_TP')]\n$EFFECT_LIST_BULLET$Ее Уровень дурной славы выше или равна $infamy_notorious$\n$EFFECT_LIST_BULLET$Отношения с [ROOT.GetCountry.GetAltNameNoFlag('RU_CL_TP')] ниже, чем $relations_neutral$"
 hm_house_of_belgium_name_change_tt.2: "Все $concept_characters$ правящей династии меняют свою фамилию на «$de_Belgique$»"