l_english:

 hm_british_windsor_name_change: "Rename the Royal House"
 hm_british_windsor_name_change_desc: "The House of Saxe-Coburg and Gotha is a German noble house of great history and prestige. However the current geopolitical climate resulted in heavy anti-German sentiment domestically and internationally. In light of this, and the increasing unpopularity of monarchies across Europe, it would be prudent to abandon all German titles and house names held under the German Crown, and chose anglicized names, thus naming the Royal House the \"House of Windsor\"."
 hm_british_windsor_name_change_tt.1: "Any [concept_country] with a [country_rank] of [concept_major_power] or above in [GetGeographicRegion('geographic_region_europe').GetName] with $north_german$ [Concept('concept_primary_cultures','$concept_primary_culture$')]:\n$EFFECT_LIST_BULLET$Is at war with [ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$Their infamy is greater than, or equal to $infamy_notorious$\n$EFFECT_LIST_BULLET$Relations with [ROOT.GetCountry.GetNameNoFlag] are less than $relations_neutral$"
 hm_british_windsor_name_change_tt.2: "All $concept_characters$ of the ruling dynasty change their surname to \"$Windsor$\""

