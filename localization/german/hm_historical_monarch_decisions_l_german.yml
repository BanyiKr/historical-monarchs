l_german:

 hm_british_windsor_name_change: "Umbenennung des Königshauses"
 hm_british_windsor_name_change_desc: "Das Haus Sachsen-Coburg und Gotha ist ein deutsches Adelshaus von großer historischer Bedeutung und hohem Ansehen. Das derzeitige geopolitische Klima hat jedoch im In- und Ausland zu starken antideutschen Stimmungen geführt. Angesichts dessen und der zunehmenden Unbeliebtheit von Monarchien in ganz Europa wäre es ratsam, alle unter der deutschen Krone geführten deutschen Titel und Hausnamen aufzugeben und anglisierte Namen zu wählen, wodurch das Königshaus fortan als „Haus Windsor“ bezeichnet würde."
 hm_british_windsor_name_change_tt.1: "Beliebiges [concept_major_power] oder höher in [GetGeographicRegion('geographic_region_europe').GetName] mit der $north_german$ [Concept('concept_primary_cultures','$concept_primary_culture$')]:\n$EFFECT_LIST_BULLET$Befindet sich im Krieg mit [ROOT.GetCountry.GetAltName('DAT')]\n$EFFECT_LIST_BULLET$Die Verrufenheit ist größer oder gleich $infamy_notorious$\n$EFFECT_LIST_BULLET$Beziehungen zu [ROOT.GetCountry.GetAltNameNoFlag('DAT')] sind niedriger als $relations_neutral$"
 hm_british_windsor_name_change_tt.2: "Alle $concept_characters$ der herrschenden Dynastie ändern ihren Nachnamen in „$Windsor$“"

 hm_house_of_belgium_name_change: "Umbenennung des Königshauses"
 hm_house_of_belgium_name_change_desc: Das Haus Sachsen-Coburg und Gotha ist ein deutsches Adelshaus von großer historischer Bedeutung und hohem Ansehen. Das derzeitige geopolitische Klima hat jedoch im In- und Ausland zu starken antideutschen Stimmungen geführt. Angesichts dessen und der zunehmenden Unbeliebtheit von Monarchien in ganz Europa wäre es ratsam, alle unter der deutschen Krone geführten deutschen Titel und Hausnamen aufzugeben und französisch angehauchte Namen zu wählen, um das Königshaus fortan als „Haus von Belgien“ zu bezeichnen.
 hm_house_of_belgium_name_change_tt.1: "Beliebiges [concept_major_power] oder höher in [GetGeographicRegion('geographic_region_europe').GetName] mit der $north_german$ [Concept('concept_primary_cultures','$concept_primary_culture$')]:\n$EFFECT_LIST_BULLET$Befindet sich im Krieg mit [ROOT.GetCountry.GetAltName('DAT')]\n$EFFECT_LIST_BULLET$Die Verrufenheit ist größer oder gleich $infamy_notorious$\n$EFFECT_LIST_BULLET$Beziehungen zu [ROOT.GetCountry.GetAltNameNoFlag('DAT')] sind niedriger als $relations_neutral$"
 hm_house_of_belgium_name_change_tt.2: "Alle $concept_characters$ der herrschenden Dynastie ändern ihren Nachnamen in „$de_Belgique$“"