 rule_hm_heir_generation: "Generierung der historischen Erben"
 setting_aggressive_heir_generation: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_aggressive_heir_generation_desc Aggressiv#!#!"
 setting_aggressive_heir_generation_desc: "Das Spiel versucht stets, einen historischen Erben zu generieren, selbst wenn dieser ein negatives Alter hätte. Dies trägt dazu bei, die Thronfolgeketten aufrechtzuerhalten"
