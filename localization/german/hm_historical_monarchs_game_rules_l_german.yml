 setting_historical_heir_generation_desc: "Das Spiel generiert historische Erben erst, nachdem diese historisch tatsächlich geboren wurden. Dadurch wird verhindert, dass Erben ein negatives Alter haben, doch die Thronfolgekette kann dauerhaft unterbrochen werden, wenn der Herrscher zuvor stirbt"