 rule_hm_scripted_deaths: "Vorherbestimmte Todesfälle historischer Monarchen"
 setting_enable_scripted_deaths: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_enable_scripted_deaths_desc Historisch#!#!"
 setting_enable_scripted_deaths_desc: "Aaktiviere vorprogrammierte Todesfälle für bestimmte Monarchen je nach Spieljahr"
