l_french:

 hm_british_windsor_name_change: "Changer le nom de la Maison royale"
 hm_british_windsor_name_change_desc: "La maison de Saxe-Cobourg et Gotha est une maison noble allemande riche d’une longue histoire et d’un grand prestige. Cependant, le climat géopolitique actuel a donné lieu à un fort sentiment anti-allemand, tant au niveau national qu’international. Compte tenu de cela, et de l’impopularité croissante des monarchies à travers l’Europe, il serait prudent de renoncer à tous les titres et noms de maison allemands détenus sous la Couronne allemande, et d’opter pour des noms anglicisés, en baptisant ainsi la maison royale « maison de Windsor »."
 hm_british_windsor_name_change_tt.1: "Un [concept_major_power] ou plus en [GetGeographicRegion('geographic_region_europe').GetName] dont la [Concept('concept_primary_cultures','$concept_primary_culture$')] est $north_german$:\n$EFFECT_LIST_BULLET$Est en guerre avec [ROOT.GetCountry.GetAltNameNoFormatting('Le')][ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$L’infamie est supérieure ou égale à $infamy_notorious$\n$EFFECT_LIST_BULLET$Les relations avec [ROOT.GetCountry.GetAltNameNoFormatting('Le')][ROOT.GetCountry.GetNameNoFlag] sont inférieures à $relations_neutral$"
 hm_british_windsor_name_change_tt.2: "Tous les $concept_characters$ de la dynastie au pouvoir changent leur nom de famille pour « $Windsor$ »"

 hm_house_of_belgium_name_change: "Changer le nom de la Maison royale"
 hm_house_of_belgium_name_change_desc: "La maison de Saxe-Cobourg et Gotha est une maison noble allemande riche d’une longue histoire et d’un grand prestige. Cependant, le climat géopolitique actuel a donné lieu à un fort sentiment anti-allemand, tant au niveau national qu’international. Compte tenu de cela, et de l’impopularité croissante des monarchies à travers l’Europe, il serait prudent de renoncer à tous les titres et noms de maison allemands détenus sous la Couronne allemande, et d’opter pour des noms gallicisés, en rebaptisant ainsi la maison royale « Maison de Belgique »."
 hm_house_of_belgium_name_change_tt.1: "Un [concept_major_power] ou plus en [GetGeographicRegion('geographic_region_europe').GetName] dont la [Concept('concept_primary_cultures','$concept_primary_culture$')] est $north_german$:\n$EFFECT_LIST_BULLET$Est en guerre avec [ROOT.GetCountry.GetAltNameNoFormatting('Le')][ROOT.GetCountry.GetName]\n$EFFECT_LIST_BULLET$L’infamie est supérieure ou égale à $infamy_notorious$\n$EFFECT_LIST_BULLET$Les relations avec [ROOT.GetCountry.GetAltNameNoFormatting('Le')][ROOT.GetCountry.GetNameNoFlag] sont inférieures à $relations_neutral$"
 hm_house_of_belgium_name_change_tt.2: "Tous les $concept_characters$ de la dynastie au pouvoir changent leur nom de famille pour « $de_Belgique$ »"