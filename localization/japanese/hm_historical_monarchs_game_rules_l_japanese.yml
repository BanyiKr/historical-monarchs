l_japanese:

 rule_hm_scripted_deaths: "あらかじめプログラムされた歴史的な君主の死の年"
 setting_enable_scripted_deaths: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_enable_scripted_deaths_desc 史実#!#!"
 setting_enable_scripted_deaths_desc: "歴史上の[Concept('concept_ruler','君主')]について、ゲーム内の時間に基づいてあらかじめプログラムされた死亡年を有効にする。"
 setting_disable_scripted_deaths: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_disable_scripted_deaths_desc 無作為#!#!"
 setting_disable_scripted_deaths_desc: "歴史上の[Concept('concept_ruler','君主')]に対して、ゲーム内の時間に基づいてあらかじめプログラムされた死亡年数を無効にする。"

 rule_hm_chinese_era_names: "中国の皇帝の名前"
 setting_use_chinese_era_name: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_use_chinese_era_name_desc 元号#!#!"
 setting_use_chinese_era_name_desc: "中国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]の名称は、即位時に元号（在位名）に変更される。"
 setting_use_chinese_personal_name: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_use_chinese_personal_name_desc 姓・諱#!#!"
 setting_use_chinese_personal_name_desc: "中国[Concept('concept_ruler','$RULER_TITLE_EMPEROR$')]の即位後もその名は諱のままとなる。"
 rule_hm_korean_era_names: "韓国の君主の名前"
 setting_use_korean_era_name: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_use_korean_era_name_desc 元号#!#!"
 setting_use_korean_era_name_desc: "韓国の[Concept('concept_ruler','君主')]の名称は、即位時に元号（君主名）に変更される。"
 setting_use_korean_personal_name: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_use_korean_personal_name_desc 姓・諱#!#!"
 setting_use_korean_personal_name_desc: "韓国[Concept('concept_ruler','君主')]の即位後もその名は諱のままとなる。"

 rule_hm_heir_generation: "歴史的継承者の作成"
 setting_aggressive_heir_generation: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_aggressive_heir_generation_desc 積極的#!#!"
 setting_aggressive_heir_generation_desc: "この設定では、生成後に年齢がマイナスになってしまう場合でも、ゲームは常に各国の歴史的な後継者を生成しようとします。これにより、王位継承の連鎖を常に維持することができます"
 setting_historical_heir_generation: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_historical_heir_generation_desc 史実#!#!"
 setting_historical_heir_generation_desc: "The この設定では、ゲームは歴史上の相続人が実際に生まれた後にのみ、その人物を生成します。これにより、年齢がマイナスの相続人が生まれるのを防ぐことができますが、統治者がその前に死亡した場合、継承の連鎖が永久に途絶えてしまう可能性があります"