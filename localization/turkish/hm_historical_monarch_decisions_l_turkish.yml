l_turkish:

 hm_british_windsor_name_change: "Kraliyet Hanedanının Adını Değiştir"
 hm_british_windsor_name_change_desc: "Saksonya-Coburg ve Gotha Hanedanı, köklü bir tarihe ve prestije sahip bir Alman asilzade hanedanıdır. Ancak mevcut jeopolitik ortam, hem yurt içinde hem de yurt dışında yoğun bir Alman karşıtı duyarlılığa yol açmıştır. Bu durum ve Avrupa genelinde monarşilerin giderek azalan popülaritesi göz önüne alındığında, Alman Krallığı bünyesinde bulunan tüm Alman unvanlarından ve hanedan adlarından vazgeçip İngilizceye uyarlanmış isimler seçmek ve böylece Kraliyet Hanedanı’na “Windsor Hanedanı” adını vermek akıllıca olacaktır."
 hm_british_windsor_name_change_tt.1: "[GetGeographicRegion('geographic_region_europe').GetName] kıtasında [concept_major_power] veya daha üst düzeyde olan ve $north_german$ı [Concept('concept_primary_cultures','$concept_primary_culture$')] olarak belirlemiş herhangi bir [concept_country]:\n$EFFECT_LIST_BULLET$[ROOT.GetCountry.GetName] ile savaşta\n$EFFECT_LIST_BULLET$Ülkesinin kötü namı $infamy_notorious$ değerinden yüksek veya bu değere eşit\n$EFFECT_LIST_BULLET$[ROOT.GetCountry.GetNameNoFlag] ile ilişki $relations_neutral$ değerinden düşük"
 hm_british_windsor_name_change_tt.2: "Hükümdar hanedanının tüm $concept_characters$ soyadlarını “$Windsor$” olarak değiştirir"

 hm_house_of_belgium_name_change: "Kraliyet Hanedanının Adını Değiştir"
 hm_house_of_belgium_name_change_desc: "Saksonya-Coburg ve Gotha Hanedanı, köklü bir tarihe ve prestije sahip bir Alman asilzade hanedanıdır. Ancak mevcut jeopolitik ortam, hem yurt içinde hem de yurt dışında yoğun bir Alman karşıtı duyarlılığa yol açmıştır. Bu durum ve Avrupa genelinde monarşilerin giderek azalan popülaritesi göz önüne alındığında, Alman Krallığı bünyesinde bulunan tüm Alman unvanlarından ve hanedan adlarından vazgeçip, Fransızca kökenli isimler seçmek ve böylece Kraliyet Hanedanı’na “Belçika Hanedanı” adını vermek akıllıca olacaktır."
 hm_house_of_belgium_name_change_tt.1: "[GetGeographicRegion('geographic_region_europe').GetName] kıtasında [concept_major_power] veya daha üst düzeyde olan ve $north_german$ı [Concept('concept_primary_cultures','$concept_primary_culture$')] olarak belirlemiş herhangi bir [concept_country]:\n$EFFECT_LIST_BULLET$[ROOT.GetCountry.GetName] ile savaşta\n$EFFECT_LIST_BULLET$Ülkesinin kötü namı $infamy_notorious$ değerinden yüksek veya bu değere eşit\n$EFFECT_LIST_BULLET$[ROOT.GetCountry.GetNameNoFlag] ile ilişki $relations_neutral$ değerinden düşük"
 hm_house_of_belgium_name_change_tt.2: "Hükümdar hanedanının tüm $concept_characters$ soyadlarını “$de_Belgique$” olarak değiştirir"